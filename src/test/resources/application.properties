spring.application.name=advtaskmanager-test
spring.datasource.url=jdbc:h2:mem:advtaskmanager-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
logging.level.root=WARN
tasks.repetition.enabled=false
tasks.pending.enabled=false
auth.enabled=false
auth.jwt.secret=test-secret-that-is-at-least-32-characters-long
